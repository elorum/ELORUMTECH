# ELORUMTECH-BING-KEY-TEST-20261020-01: manual, read-only Bing Webmaster API key test.
# Only GET GetUserSites and GetKeyword. Never prints the key, URL, headers or raw error body.
name: bing-key-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bing-key-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      API: https://ssl.bing.com/webmaster/api.svc/json
    steps:
      - name: Check secret and mask
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret BING_WEBMASTER_API_KEY is not set for this repository."
            exit 1
          fi
          echo "::add-mask::$KEY"

      - name: GetUserSites and GetKeyword (GET only)
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          safe_err() {
            jq -r '.Message // empty' "$BODY" 2>/dev/null | sed "s/${KEY}/***/g" | head -c 300 || true
          }
          out() { printf '%s\n' "$1"; printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }

          out "## Bing key test"
          CODE=$(curl -sS -G -o "$BODY" -w '%{http_code}' "$API/GetUserSites" --data-urlencode "apikey=$KEY" || true)
          out "GetUserSites HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            jq -r '.d[]? | "- \(.Url) IsVerified=\(.IsVerified)"' "$BODY" | while IFS= read -r l; do out "$l"; done
            if jq -e '[.d[]?.Url] | any(test("elorumtech\\.elorum\\.world"))' "$BODY" >/dev/null; then
              out "elorumtech.elorum.world listed: yes"
            else
              out "elorumtech.elorum.world listed: no"
            fi
          else
            out "GetUserSites error: $(safe_err)"
          fi

          END=$(date -u +%Y-%m-%d)
          START=$(date -u -d '3 months ago' +%Y-%m-%d)
          CODE=$(curl -sS -G -o "$BODY" -w '%{http_code}' "$API/GetKeyword" \
            --data-urlencode "q=hdmi" --data-urlencode "country=us" --data-urlencode "language=en-US" \
            --data-urlencode "startDate=$START" --data-urlencode "endDate=$END" \
            --data-urlencode "apikey=$KEY" || true)
          out "GetKeyword q=hdmi us/en-US $START..$END HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            jq -r '(.d | if type=="array" then .[:5][] else . end) | "- \(.Query) Impressions=\(.Impressions) BroadImpressions=\(.BroadImpressions)"' "$BODY" | while IFS= read -r l; do out "$l"; done
          else
            out "GetKeyword error: $(safe_err)"
          fi
          rm -f "$BODY"
